name: vsc-smith CI for Documents

on:
  push:
    paths:
      - 'docs/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Table of Contents
        run: |
          npm install --no-save markdown-toc
          npx markdown-toc -i docs/roadmap.md

      - name: Commit & Push
        run:  |
          git config --global user.name "update_toc:github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.md
          git diff --staged --exit-code || (git commit -m "Update ToC" && git push)
