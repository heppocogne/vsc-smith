name: vsc-smith Lint

on:
  push:
    tags-ignore:
      - '**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run check-types
      - name: Lint
        run: npm run lint
