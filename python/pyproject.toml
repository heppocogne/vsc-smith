[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vsc-smith-pyfmt"
version = "0.2.1"
description = "A small Black-style Python formatter built on ast and tokenize"
readme = { text = "Python formatter bundled with the vsc-smith VS Code extension.", content-type = "text/plain" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "heppocogne" }]
dependencies = []

[project.urls]
Repository = "https://github.com/heppocogne/vsc-smith"

[tool.setuptools]
packages = ["vsc_smith_pyfmt"]
